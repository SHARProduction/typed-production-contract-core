name: Publish JSR package
on:
  push:
    branches: [main]
    paths: ["src/**", "bin/**", "jsr.json", "package.json", "test/**", ".github/workflows/publish-jsr.yml"]
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test
      - run: npx jsr publish
